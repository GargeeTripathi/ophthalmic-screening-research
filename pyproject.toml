[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophthalmic-screening-research"
version = "0.1.0"
description = "Provenance-aware, patient-disjoint evaluation of ophthalmic screening with controlled document reliability"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
